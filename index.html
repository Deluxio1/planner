<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f9">
<link rel="apple-touch-icon" href="icon.png">
<title>Планер недели</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--text:#1b2430;--muted:#7a8594;--line:#e3e7ec;
  --accent:#2b59c3;--accent-soft:#eef2fb;--on-accent:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161c;--surface:#181d25;--text:#e8ecf2;--muted:#8692a3;--line:#262d38;
    --accent:#7d9cf0;--accent-soft:#1c2433;--on-accent:#12161c;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c;--surface:#181d25;--text:#e8ecf2;--muted:#8692a3;--line:#262d38;
  --accent:#7d9cf0;--accent-soft:#1c2433;--on-accent:#12161c;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
nav{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.nb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 13px;min-width:40px}
.nb:hover{background:var(--accent-soft)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);
  border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day{padding:14px 12px;border-left:1px solid var(--line);min-height:300px;display:flex;flex-direction:column;gap:4px}
.day:first-child{border-left:0}
.day.today{background:var(--accent-soft)}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wd{color:var(--muted);font-size:13px;font-weight:500}
.dn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px}
.today .dn{background:var(--accent);color:var(--on-accent)}
.ev{display:flex;align-items:flex-start;gap:6px;padding:7px 8px;border-radius:10px;cursor:pointer;position:relative}
.ev:hover{background:var(--accent-soft)}
.today .ev:hover{background:var(--surface)}
.ev .body{flex:1;min-width:0}
.ev .t{display:block;font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.ev .tt{display:block;word-break:break-word}
.ev.done .tt{text-decoration:line-through;color:var(--muted)}
.ev.done .t{color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 4px;opacity:0;border-radius:6px}
.ev:hover .x,.x:focus-visible{opacity:1}
@media (hover:none){.x{opacity:.6}}
.addbtn{margin-top:auto;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:7px 8px;text-align:left}
.addbtn:hover{color:var(--accent);border-color:var(--accent)}
form{margin-top:auto;display:flex;flex-direction:column;gap:6px}
input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;width:100%;min-width:0}
.row{display:flex;gap:6px}
.save{flex:1;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:7px 10px;font-weight:600}
.cancel{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--muted)}
.c1{--c:#e5484d}.c2{--c:#f08c00}.c3{--c:#2f9e6b}.c4{--c:#2b59c3}.c5{--c:#8e5bd9}
.ev[data-c]{border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.ev[data-c]:hover{background:color-mix(in srgb,var(--c) 24%,transparent)}
.dot,.swb{border-radius:50%;padding:0;flex:none;background:var(--c,transparent);border:1.5px solid var(--c,var(--muted))}
.dot{width:12px;height:12px;margin-top:5px}
.sw{display:flex;gap:9px;padding:2px}
.swb{width:18px;height:18px}
.swb.on{outline:2px solid var(--text);outline-offset:2px}
.d1{--dc:#e5484d}.d2{--dc:#f08c00}.d3{--dc:#2f9e6b}.d4{--dc:#2b59c3}.d5{--dc:#8e5bd9}
.dn{background:none;border:0;padding:0;color:inherit;font-family:inherit;cursor:pointer}
.dn:hover{box-shadow:inset 0 0 0 1.5px var(--muted)}
.day.dc{background:color-mix(in srgb,var(--dc) 10%,transparent)}
.day.dc .dn{background:var(--dc);color:#fff}
.day.today.dc .dn{outline:2px solid var(--accent);outline-offset:2px}
.todo{margin-top:32px}
.todo h2{margin:0 0 12px;font-size:18px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ch h3{margin:0;font-size:15px;font-weight:700;flex:1;min-width:0;word-break:break-word}
.cnt{color:var(--muted);font-size:13px}
.ch .x,.it .x{opacity:.45}
.ch .x:hover,.it .x:hover{opacity:1}
.x.arm{opacity:1;color:#e5484d;font-size:13px}
.it{display:flex;align-items:center;gap:8px;padding:5px 2px}
.it input{width:18px;height:18px;padding:0;accent-color:var(--accent);flex:none}
.it span{flex:1;min-width:0;word-break:break-word}
.it.done span{text-decoration:line-through;color:var(--muted)}
.cat form{flex-direction:row;margin-top:8px}
.newcat{flex-direction:row;margin-top:12px;max-width:520px}
.newcat .save{flex:none;white-space:nowrap}
.ki{margin-left:auto;font-size:15px;letter-spacing:2px}
.day.dk:not(.dc){background:color-mix(in srgb,var(--kc) 13%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 7px;font-size:15px;line-height:1.2}
.chip:hover{border-color:var(--accent)}
#month{touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wh{background:var(--surface);padding:8px 4px;text-align:center;color:var(--muted);font-size:13px;font-weight:500}
.cell{font:inherit;color:inherit;text-align:left;background:var(--surface);border:0;padding:6px;min-height:104px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;transition:box-shadow .15s}
.cell:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cell.today:not(.dc):not(.dk){background:var(--accent-soft)}
.cell.dk:not(.dc){background:color-mix(in srgb,var(--kc) 15%,var(--surface))}
.cell.dc{background:color-mix(in srgb,var(--dc) 13%,var(--surface))}
.ct{display:flex;align-items:center;justify-content:space-between}
.dn2{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px}
.cell.today .dn2{background:var(--accent);color:var(--on-accent)}
.cell.dc .dn2{background:var(--dc);color:#fff}
.cell.today.dc .dn2{outline:2px solid var(--accent);outline-offset:2px}
.cell.out .dn2{color:var(--muted)}
.cell.out .pv,.cell.out .dots,.cell.out .ki{opacity:.5}
.pv{display:flex;flex-direction:column;gap:2px;min-width:0}
.pe{font-size:12px;line-height:1.3;padding:1px 5px;border-radius:5px;border-left:3px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 15%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe.done{text-decoration:line-through;color:var(--muted)}
.more{font-size:12px;color:var(--muted);padding-left:2px}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}
.pd{width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent))}
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(10,14,20,.45);animation:fade .18s}
.sheet[hidden]{display:none}
.panel{width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:20px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
.panel.rise{animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ph h3{margin:0;font-size:18px}
.lab{font-size:13px;color:var(--muted);margin:12px 0 5px}
.panel .ev{margin-bottom:2px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.tabs{display:none;gap:4px;margin-top:20px;background:var(--line);padding:3px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font:inherit;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
textarea{font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%;resize:vertical}
.msg{font-size:13px;color:var(--accent);margin-top:6px;min-height:18px}
.panel button.save,.panel button.cancel{width:100%;margin-top:8px}
#agenda{display:none;margin-top:20px}
#agenda h2{margin:0 0 10px;font-size:18px;font-weight:700}
.ag{display:flex;flex-direction:column;gap:6px}
.agr{font:inherit;color:inherit;text-align:left;display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.agd{flex:none;width:72px;color:var(--muted);font-size:13px;font-weight:600}
.agl{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.agi{border-left:3px solid var(--c,var(--accent));padding-left:7px;word-break:break-word}
.agi.done{text-decoration:line-through;color:var(--muted)}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:splashOut .45s ease 1.25s forwards}
#splash .tile{width:112px;height:112px;border-radius:26px;background:var(--surface);box-shadow:0 12px 36px rgba(43,89,195,.3);overflow:hidden;display:flex;flex-direction:column;animation:iconIn .8s cubic-bezier(.2,.9,.3,1.2) backwards}
#splash .tw{background:#e5484d;color:#fff;text-align:center;font-weight:700;font-size:14px;padding:7px 0 5px}
#splash .tn{flex:1;display:grid;place-items:center;font-size:52px;font-weight:700;color:var(--text)}
#splash .sn{font-size:20px;font-weight:700;letter-spacing:-.01em;animation:rise2 .5s ease .35s backwards}
@keyframes iconIn{from{transform:scale(.4) rotate(-10deg);opacity:0}}
@keyframes rise2{from{transform:translateY(10px);opacity:0}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(26px) scale(.98);opacity:0}}
@keyframes slideR{from{transform:translateX(30px);opacity:0}}
@keyframes slideL{from{transform:translateX(-30px);opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.go-r{animation:slideR .3s ease-out}
.go-l{animation:slideL .3s ease-out}
.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1) backwards}
@media (max-width:700px){
  .cell{min-height:92px;padding:3px}
  .ct{justify-content:flex-start;gap:2px}
  .dn2{width:22px;height:22px;font-size:12px}
  .ki{display:none}
  .pe{font-size:10px;line-height:1.2;padding:1px 3px;border-left-width:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .tabs{display:flex}
  #lower[data-tab="month"] #agenda{display:block}
  #lower[data-tab="month"] .todo{display:none}
  .todo,#agenda{margin-top:14px}
  .todo h2,#agenda h2{display:none}
  .sheet{align-items:end;padding:0}
  .panel{width:100%;border-radius:20px 20px 0 0;max-height:88%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash{display:none}}
@media (max-width:900px){
  .week{grid-template-columns:1fr}
  .day{border-left:0;border-top:1px solid var(--line);min-height:0}
  .day:first-child{border-top:0}
}
</style>
</head>
<body>
<div id="splash"><div class="tile"><div class="tw" id="spw"></div><div class="tn" id="spn"></div></div><div class="sn">Планер</div></div>
<div class="wrap">
  <header>
    <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
    <nav>
      <button class="nb" id="prev" aria-label="Предыдущий месяц">‹</button>
      <button class="nb" id="today">Сегодня</button>
      <button class="nb" id="next" aria-label="Следующий месяц">›</button>
      <button class="nb" id="rf" aria-label="Обновить" title="Обновить">↻</button>
      <button class="nb" id="bk" aria-label="Копия данных" title="Копия данных">⋯</button>
    </nav>
  </header>
  <main id="month"></main>
  <div class="sheet" id="sheet" hidden></div>
  <div class="tabs"><button id="tabL" type="button">Списки</button><button id="tabM" type="button">Дела месяца</button></div>
  <div id="lower" data-tab="lists">
  <section id="agenda"></section>
  <section class="todo">
    <h2>Дела</h2>
    <div class="cats" id="cats"></div>
    <form class="newcat" id="catform">
      <input id="catname" type="text" placeholder="Новый раздел, например «Работа»" aria-label="Название раздела">
      <button class="save" type="submit">Создать раздел</button>
    </form>
  </section>
  </div>
</div>
<script>
const KEY = 'planner-week-v1';
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const COLORS = ['', 'c1', 'c2', 'c3', 'c4', 'c5'];
const KINDS = [
  { id: 'clean',   icon: '🧹', name: 'Уборка',   text: 'Уборка',            color: '#2f9e6b', re: /убор|пылесос|протер/i },
  { id: 'shop',    icon: '🛒', name: 'Продукты', text: 'Купить продукты',   color: '#f08c00', re: /продукт|магазин|супермаркет/i },
  { id: 'laundry', icon: '🧺', name: 'Стирка',   text: 'Стирка',            color: '#2b8fc3', re: /стир|бельё|белье|гладить|утюг/i },
  { id: 'cook',    icon: '🍲', name: 'Готовка',  text: 'Приготовить ужин',  color: '#e5484d', re: /приготов|готовк|готовить|ужин|обед/i },
  { id: 'trash',   icon: '🗑️', name: 'Мусор',    text: 'Вынести мусор',     color: '#7a8594', re: /мусор/i },
  { id: 'plants',  icon: '🪴', name: 'Цветы',    text: 'Полить цветы',      color: '#7cb342', re: /цветы|цветов|полить|растени/i },
  { id: 'bills',   icon: '💳', name: 'Счета',    text: 'Оплатить счета',    color: '#8e5bd9', re: /оплат|счета|счёт|коммунал/i },
  { id: 'sport',   icon: '🏃', name: 'Спорт',    text: 'Тренировка',        color: '#d6409f', re: /спорт|трениров|пробеж|бег/i }
];
function kindOf(e) {
  return KINDS.find(k => k.id === e.kind) || (e.kind == null ? KINDS.find(k => k.re.test(e.title)) : null) || null;
}
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

const DKEY = 'planner-days-v1';
let dayColors = {};
try { dayColors = JSON.parse(localStorage.getItem(DKEY) || '{}') || {}; } catch (e) { dayColors = {}; }
function saveDays() { try { localStorage.setItem(DKEY, JSON.stringify(dayColors)); } catch (e) {} }
let vy = new Date().getFullYear(), vm = new Date().getMonth(), sel = null, lastAdded = null;
const MFULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const FWD = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const byTime = (a, b) => (a.time || '99:99').localeCompare(b.time || '99:99');
function dayEvs(k) { return (data[k] || []).slice().sort(byTime); }
function kindsOf(list) {
  const r = [];
  list.forEach(e => { const kd = kindOf(e); if (kd && !r.includes(kd)) r.push(kd); });
  return r;
}

function renderMonth(dir) {
  const box = document.getElementById('month');
  const grid = el('div', 'grid' + (dir === 'r' || dir === 'l' ? ' go-' + dir : ''));
  WD.forEach(w => grid.append(el('div', 'wh', w)));
  const first = new Date(vy, vm, 1);
  const days = new Date(vy, vm + 1, 0).getDate();
  const weeks = Math.ceil((((first.getDay() + 6) % 7) + days) / 7);
  const start = startOfWeek(first);
  const todayKey = iso(new Date());
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = iso(d);
    const evs = dayEvs(k), kinds = kindsOf(evs);
    const c = el('button', 'cell' + (d.getMonth() !== vm ? ' out' : '') + (k === todayKey ? ' today' : '')
      + (dayColors[k] ? ' dc d' + dayColors[k].slice(1) : '') + (kinds.length ? ' dk' : '') + (dir ? ' pop' : ''));
    c.type = 'button';
    c.setAttribute('aria-label', d.getDate() + ' ' + MONG[d.getMonth()]);
    if (kinds.length) c.style.setProperty('--kc', kinds[0].color);
    if (dir) c.style.animationDelay = (i * 10) + 'ms';
    const top = el('div', 'ct');
    top.append(el('span', 'dn2', d.getDate()));
    if (kinds.length) top.append(el('span', 'ki', kinds.map(x => x.icon).join('')));
    c.append(top);
    const pv = el('div', 'pv');
    evs.forEach(e => {
      const kd = kindOf(e);
      const p = el('div', 'pe' + (e.done ? ' done' : '') + (e.color ? ' ' + e.color : ''), (kd ? kd.icon + ' ' : '') + e.title);
      if (!e.color && kd) p.style.setProperty('--c', kd.color);
      pv.append(p);
    });
    c.append(pv);
    c.onclick = () => { sel = k; renderSheet(false); };
    grid.append(c);
  }
  box.innerHTML = '';
  box.append(grid);
  document.getElementById('title').textContent = MFULL[vm] + ' ' + vy;
  renderAgenda();
}

function renderAgenda() {
  const a = document.getElementById('agenda');
  a.innerHTML = '';
  a.append(el('h2', null, 'Дела месяца'));
  const box = el('div', 'ag');
  const days = new Date(vy, vm + 1, 0).getDate();
  let any = false;
  for (let n = 1; n <= days; n++) {
    const dd = new Date(vy, vm, n), k = iso(dd), evs = dayEvs(k);
    if (!evs.length) continue;
    any = true;
    const row = el('button', 'agr'); row.type = 'button';
    row.append(el('span', 'agd', n + ' ' + MON[vm] + ', ' + WD[(dd.getDay() + 6) % 7]));
    const col = el('span', 'agl');
    evs.forEach(e => {
      const kd = kindOf(e);
      const li = el('span', 'agi' + (e.done ? ' done' : '') + (e.color ? ' ' + e.color : ''),
        (e.time ? e.time + ' ' : '') + (kd ? kd.icon + ' ' : '') + e.title);
      if (!e.color && kd) li.style.setProperty('--c', kd.color);
      col.append(li);
    });
    row.append(col);
    row.onclick = () => { sel = k; renderSheet(false); };
    box.append(row);
  }
  if (!any) box.append(el('div', 'lab', 'В этом месяце пока ничего не запланировано'));
  a.append(box);
}

function addEv(k, time, title, color, kind) {
  const ev = { id: Date.now() + Math.random(), time: time, title: title, done: false, color: color, kind: kind };
  (data[k] = data[k] || []).push(ev);
  lastAdded = ev.id;
  save(); renderMonth(); renderSheet(true);
}
function refresh() { save(); renderMonth(); renderSheet(false); }

function renderSheet(focus) {
  const s = document.getElementById('sheet');
  if (!sel) { s.hidden = true; s.innerHTML = ''; return; }
  const fresh = s.hidden;
  const k = sel;
  const [Y, M, D] = k.split('-').map(Number);
  const d = new Date(Y, M - 1, D);
  s.hidden = false; s.innerHTML = '';
  const p = el('div', 'panel' + (fresh ? ' rise' : ''));
  p.setAttribute('role', 'dialog');

  const ph = el('div', 'ph');
  ph.append(el('h3', null, FWD[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MONG[d.getMonth()]));
  const cl = el('button', 'x', '×'); cl.type = 'button'; cl.setAttribute('aria-label', 'Закрыть');
  cl.style.opacity = 1; cl.style.fontSize = '26px';
  cl.onclick = closeSheet;
  ph.append(cl); p.append(ph);

  p.append(el('div', 'lab', 'Цвет дня'));
  const dsw = el('div', 'sw');
  COLORS.forEach(c => {
    const b = el('button', 'swb ' + c + ((dayColors[k] || '') === c ? ' on' : ''));
    b.type = 'button'; b.setAttribute('aria-label', 'Цвет дня');
    b.onclick = () => { if (c) dayColors[k] = c; else delete dayColors[k]; saveDays(); renderMonth(); renderSheet(false); };
    dsw.append(b);
  });
  p.append(dsw);

  const list = dayEvs(k);
  p.append(el('div', 'lab', list.length ? 'Дела на день' : 'Пока ничего не запланировано'));
  list.forEach(ev => {
    const kd = kindOf(ev);
    const row = el('div', 'ev' + (ev.done ? ' done' : '') + (ev.color ? ' ' + ev.color : '') + (ev.id === lastAdded ? ' pop' : ''));
    if (ev.color) row.dataset.c = '1';
    else if (kd) { row.dataset.c = '1'; row.style.setProperty('--c', kd.color); }
    const body = el('div', 'body');
    if (ev.time) body.append(el('span', 't', ev.time));
    body.append(el('span', 'tt', (kd ? kd.icon + ' ' : '') + ev.title));
    const dot = el('button', 'dot'); dot.type = 'button'; dot.title = 'Сменить цвет'; dot.setAttribute('aria-label', 'Сменить цвет');
    dot.onclick = e => { e.stopPropagation(); ev.color = COLORS[(COLORS.indexOf(ev.color || '') + 1) % COLORS.length]; refresh(); };
    const del = el('button', 'x', '×'); del.type = 'button'; del.title = 'Удалить'; del.setAttribute('aria-label', 'Удалить');
    del.onclick = e => { e.stopPropagation(); data[k] = data[k].filter(x => x.id !== ev.id); refresh(); };
    row.onclick = () => { ev.done = !ev.done; refresh(); };
    row.append(dot, body, del);
    p.append(row);
  });
  lastAdded = null;

  p.append(el('div', 'lab', 'Добавить'));
  const f = el('form');
  const time = el('input'); time.type = 'time'; time.setAttribute('aria-label', 'Время');
  const text = el('input'); text.type = 'text'; text.placeholder = 'Что запланировано'; text.setAttribute('aria-label', 'Событие');
  const chips = el('div', 'chips');
  KINDS.forEach(kd => {
    const b = el('button', 'chip', kd.icon); b.type = 'button';
    b.title = kd.text; b.setAttribute('aria-label', kd.text);
    b.onclick = () => addEv(k, time.value, kd.text, '', kd.id);
    chips.append(b);
  });
  let picked = '';
  const sw = el('div', 'sw');
  COLORS.forEach(c => {
    const b = el('button', 'swb ' + c + (c === '' ? ' on' : '')); b.type = 'button'; b.setAttribute('aria-label', 'Цвет');
    b.onclick = () => { picked = c; sw.querySelectorAll('.swb').forEach(x => x.classList.toggle('on', x === b)); };
    sw.append(b);
  });
  const ok = el('button', 'save', 'Сохранить'); ok.type = 'submit';
  f.append(time, text, chips, sw, ok);
  f.onsubmit = e => {
    e.preventDefault();
    const t = text.value.trim();
    if (!t) { text.focus(); return; }
    addEv(k, time.value, t, picked, (KINDS.find(x => x.re.test(t)) || {}).id || '');
  };
  p.append(f);
  s.append(p);
  if (focus) text.focus();
}
function closeSheet() { sel = null; renderSheet(false); }
document.getElementById('sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sel) closeSheet(); });

function go(n) {
  vm += n;
  if (vm < 0) { vm = 11; vy--; }
  if (vm > 11) { vm = 0; vy++; }
  renderMonth(n > 0 ? 'r' : 'l');
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('today').onclick = () => { vy = new Date().getFullYear(); vm = new Date().getMonth(); renderMonth('f'); };
let sx = null;
const mb = document.getElementById('month');
mb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
mb.addEventListener('touchend', e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 70) go(dx < 0 ? 1 : -1);
});
renderMonth('f');

const TKEY = 'planner-todo-v1';
let todo = null;
try { todo = JSON.parse(localStorage.getItem(TKEY) || 'null'); } catch (e) { todo = null; }
if (!Array.isArray(todo)) {
  todo = [
    { id: 'c-home', name: 'Домашние дела', items: [] },
    { id: 'c-clean', name: 'Уборка', items: [] },
    { id: 'c-shop', name: 'Купить продукты', items: [] }
  ];
}
function saveTodo() { try { localStorage.setItem(TKEY, JSON.stringify(todo)); } catch (e) {} }
let todoFocus = null;
let armedCat = null;

function renderTodo() {
  const box = document.getElementById('cats');
  box.innerHTML = '';
  todo.forEach(cat => {
    const c = el('div', 'cat');
    const h = el('div', 'ch');
    const left = cat.items.filter(i => !i.done).length;
    h.append(el('h3', null, cat.name));
    if (cat.items.length) h.append(el('span', 'cnt', left + ' из ' + cat.items.length));
    const armed = armedCat === cat.id;
    const rm = el('button', 'x' + (armed ? ' arm' : ''), armed ? 'Удалить?' : '×');
    rm.type = 'button'; rm.title = 'Удалить раздел';
    rm.onclick = () => {
      if (!cat.items.length || armed) { todo = todo.filter(x => x !== cat); armedCat = null; }
      else armedCat = cat.id;
      saveTodo(); renderTodo();
    };
    h.append(rm);
    c.append(h);

    cat.items.forEach(it => {
      const row = el('div', 'it' + (it.done ? ' done' : ''));
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!it.done;
      cb.setAttribute('aria-label', 'Выполнено');
      cb.onchange = () => { it.done = cb.checked; saveTodo(); renderTodo(); };
      const del = el('button', 'x', '×'); del.type = 'button'; del.title = 'Удалить';
      del.onclick = () => { cat.items = cat.items.filter(x => x !== it); saveTodo(); renderTodo(); };
      row.append(cb, el('span', null, it.text), del);
      c.append(row);
    });

    const f = el('form');
    const inp = el('input'); inp.type = 'text'; inp.placeholder = 'Добавить дело';
    inp.setAttribute('aria-label', 'Новое дело в разделе ' + cat.name);
    inp.dataset.tf = cat.id;
    f.append(inp);
    f.onsubmit = e => {
      e.preventDefault();
      const t = inp.value.trim();
      if (!t) return;
      cat.items.push({ id: Date.now() + Math.random(), text: t, done: false });
      todoFocus = cat.id; armedCat = null;
      saveTodo(); renderTodo();
    };
    c.append(f);
    box.append(c);
  });
  if (todoFocus) {
    const n = box.querySelector('[data-tf="' + todoFocus + '"]');
    if (n) n.focus();
    todoFocus = null;
  }
}

document.getElementById('catform').onsubmit = e => {
  e.preventDefault();
  const inp = document.getElementById('catname');
  const name = inp.value.trim();
  if (!name) return;
  todo.push({ id: 'c' + Date.now(), name, items: [] });
  inp.value = '';
  saveTodo(); renderTodo();
};
renderTodo();
const VER = '3';
let tab = 'lists';
try { tab = localStorage.getItem('planner-tab') || 'lists'; } catch (e) {}
function setTab(t) {
  tab = t;
  document.getElementById('lower').dataset.tab = t;
  document.getElementById('tabL').classList.toggle('on', t === 'lists');
  document.getElementById('tabM').classList.toggle('on', t === 'month');
  try { localStorage.setItem('planner-tab', t); } catch (e) {}
}
document.getElementById('tabL').onclick = () => setTab('lists');
document.getElementById('tabM').onclick = () => setTab('month');
setTab(tab);

function updateSub() {
  const n = new Date(), wd = FWD[(n.getDay() + 6) % 7];
  const sub = document.getElementById('sub');
  if (sub) sub.textContent = 'Сегодня ' + wd.toLowerCase() + ', ' + n.getDate() + ' ' + MONG[n.getMonth()];
  const a = document.getElementById('spw'), b = document.getElementById('spn');
  if (a) a.textContent = wd;
  if (b) b.textContent = n.getDate();
}
updateSub();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { updateSub(); renderMonth(); } });

document.getElementById('rf').onclick = () => {
  fetch(location.pathname, { cache: 'reload' }).catch(() => {}).finally(() => location.reload());
};
try {
  fetch(location.pathname, { cache: 'reload' }).then(r => r.text()).then(t => {
    const m = t.match(/const VER = '([^']+)'/);
    if (m && m[1] !== VER && sessionStorage.getItem('planner-rl') !== m[1]) {
      sessionStorage.setItem('planner-rl', m[1]);
      location.reload();
    }
  }).catch(() => {});
} catch (e) {}

document.getElementById('bk').onclick = () => {
  sel = null;
  const s = document.getElementById('sheet');
  const fresh = s.hidden;
  s.hidden = false; s.innerHTML = '';
  const p = el('div', 'panel' + (fresh ? ' rise' : ''));
  const ph = el('div', 'ph');
  ph.append(el('h3', null, 'Копия данных'));
  const cl = el('button', 'x', '×'); cl.type = 'button'; cl.setAttribute('aria-label', 'Закрыть');
  cl.style.opacity = 1; cl.style.fontSize = '26px'; cl.onclick = closeSheet;
  ph.append(cl); p.append(ph);
  p.append(el('div', 'lab', 'Скопируй этот текст и сохрани в заметках. Если записи пропадут, вставь его в поле ниже.'));
  const out = el('textarea'); out.readOnly = true; out.rows = 4;
  out.value = JSON.stringify({ v: 1, data: data, dayColors: dayColors, todo: todo });
  p.append(out);
  const msg = el('div', 'msg');
  const cp = el('button', 'save', 'Скопировать'); cp.type = 'button';
  cp.onclick = () => {
    out.select(); out.setSelectionRange(0, out.value.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (!ok && navigator.clipboard) navigator.clipboard.writeText(out.value).catch(() => {});
    msg.textContent = 'Скопировано. Если не вышло, выдели текст и скопируй вручную.';
  };
  p.append(cp);
  p.append(el('div', 'lab', 'Восстановить из копии'));
  const inp = el('textarea'); inp.rows = 3; inp.placeholder = 'Вставь сюда сохранённый текст';
  p.append(inp);
  const rs = el('button', 'cancel', 'Заменить данные из текста'); rs.type = 'button';
  rs.onclick = () => {
    try {
      const o = JSON.parse(inp.value.trim());
      if (!o || typeof o !== 'object' || !o.data) throw new Error('bad');
      data = o.data; dayColors = o.dayColors || {};
      if (Array.isArray(o.todo)) todo = o.todo;
      save(); saveDays(); saveTodo(); renderMonth(); renderTodo();
      msg.textContent = 'Данные восстановлены.';
    } catch (e) {
      msg.textContent = 'Не получилось прочитать текст. Скопируй его целиком.';
    }
  };
  p.append(rs, msg);
  s.append(p);
};

setTimeout(() => { const sp = document.getElementById('splash'); if (sp) sp.remove(); }, 1900);
</script>
