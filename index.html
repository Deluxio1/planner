<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf1f2">
<link rel="apple-touch-icon" href="icon.png">
<title>Планер недели</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#fbf1f2;--surface:#fffcfc;--mist:#f6dde3;--we:#f8e7eb;--line:#f0e1e5;--scrim:rgba(40,18,28,.32);
  --rose:#cf6585;--rose-ink:#9c3f5c;--on-rose:#fff;--text:#3e2a35;--muted:#9a8790;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1317;--surface:#261b20;--mist:#3a2630;--we:#35242c;--line:#36272d;--scrim:rgba(0,0,0,.6);
    --rose:#e48aa4;--rose-ink:#f2b3c4;--on-rose:#2a1219;--text:#f6e9ee;--muted:#a8939d;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1317;--surface:#261b20;--mist:#3a2630;--we:#35242c;--line:#36272d;--scrim:rgba(0,0,0,.6);
  --rose:#e48aa4;--rose-ink:#f2b3c4;--on-rose:#2a1219;--text:#f6e9ee;--muted:#a8939d;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:400 16px/1.45 "Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 56px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font:700 44px/1 "Unbounded",system-ui,sans-serif;letter-spacing:-.02em}
.yr{font-weight:500;font-size:.45em;color:var(--muted);margin-left:.4em;letter-spacing:0;vertical-align:.6em}
.sub{color:var(--muted);font-size:14px;margin-top:8px}
nav{display:flex;align-items:center;gap:2px}
.nb{background:transparent;border:0;border-radius:12px;padding:8px 11px;min-width:40px;font-size:16px}
.nb:hover{background:var(--mist)}
#prev,#next{font-size:24px;line-height:1;padding:5px 12px}
#today{background:var(--mist);color:var(--rose-ink);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:500;margin:0 4px}
#rf,#bk{color:var(--muted)}

/* month: flat tiles, chores as stickers */
#month{touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wh{padding:0 6px 4px;font-size:12px;color:var(--muted)}
.wh:nth-child(6),.wh:nth-child(7){color:var(--rose-ink)}
.cell{font:inherit;color:inherit;text-align:left;background:var(--surface);border:0;border-radius:10px;padding:8px;
  min-height:108px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;transition:background-color .15s}
.cell.we{background:var(--we)}
.cell:hover{background:var(--mist)}
.cell.out{background:transparent}
.cell.out .dn2{color:var(--muted)}
.cell.out .pv{opacity:.5}
.cell.dc{background:color-mix(in srgb,var(--dc) 24%,var(--surface))}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--rose)}
.cell.today{background:var(--rose);color:var(--on-rose);box-shadow:none}
.dn2{font:500 14px/1 "Unbounded",system-ui,sans-serif}
.cell.today .dn2{font-weight:700}
.pv{display:flex;flex-direction:column;gap:4px;min-width:0}
.pe{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.3;min-width:0;white-space:nowrap}
.sq{flex:none;width:9px;height:9px;border-radius:3px;background:var(--c,var(--rose))}
.cell.today .sq{box-shadow:0 0 0 1.5px var(--on-rose)}
.ptx{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pt{font-weight:500;font-variant-numeric:tabular-nums;margin-right:4px;opacity:.7}
.pe.done{opacity:.55}
.cell.today .pe.done{opacity:.85}
.pe.done .ptx{text-decoration:line-through}
.pe.done .sq{opacity:.45}

.c1{--c:#e8897f}.c2{--c:#f2b27a}.c3{--c:#8fd1ae}.c4{--c:#8db8ec}.c5{--c:#b9a2ea}
.d1{--dc:#e8897f}.d2{--dc:#f2b27a}.d3{--dc:#8fd1ae}.d4{--dc:#8db8ec}.d5{--dc:#b9a2ea}

/* chore icon sticker */
.ic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;padding:0;border:0;font-size:18px;
  background:color-mix(in srgb,var(--c,var(--rose)) 30%,var(--surface));color:color-mix(in srgb,var(--c,var(--rose)) 50%,var(--text))}

/* day sheet */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:var(--scrim);animation:fade .18s}
.sheet[hidden]{display:none}
.panel{width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:24px;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 24px 64px rgba(60,20,40,.22)}
.panel.rise{animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.ph h3{margin:0;font:700 22px/1.2 "Unbounded",system-ui,sans-serif}
.lab{font-size:13px;color:var(--muted);margin:16px 0 6px}
.ev{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:12px;cursor:pointer;margin-bottom:2px}
.ev:hover{background:var(--bg)}
.ev .body{flex:1;min-width:0}
.ev .t{display:block;font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .tt{display:block;word-break:break-word}
.ev.done .tt{text-decoration:line-through;color:var(--muted)}
.ev.done .ic{opacity:.45}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:8px;opacity:.55}
.x:hover,.x:focus-visible{opacity:1}
.x.arm{opacity:1;color:var(--rose-ink);font-size:13px}

form{display:flex;flex-direction:column;gap:6px}
input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--rose)}
textarea{font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.save{background:var(--rose);color:var(--on-rose);border:0;border-radius:12px;padding:11px 16px;font-weight:500}
.cancel{background:none;border:1.5px solid var(--mist);color:var(--rose-ink);border-radius:12px;padding:10px 14px}
.panel button.save,.panel button.cancel{width:100%;margin-top:8px}
.sw{display:flex;gap:10px;padding:2px}
.swb{width:26px;height:26px;border-radius:8px;padding:0;flex:none;background:var(--c,transparent);border:1.5px solid var(--c,var(--muted))}
.swb.on{outline:2px solid var(--text);outline-offset:2px}
.msg{font-size:13px;color:var(--rose-ink);margin-top:6px;min-height:18px}

/* lists / day tabs */
.tabs{display:flex;max-width:360px;gap:4px;margin-top:28px;background:var(--mist);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px;font-size:14px;font-weight:500;color:var(--rose-ink)}
.tabs button.on{background:var(--surface);color:var(--text)}
#agenda{display:none;margin-top:20px}
#lower[data-tab="day"] #agenda{display:block}
#lower[data-tab="day"] .todo{display:none}
.todo{margin-top:20px}
.todo h2,#agenda h2{display:none}
#todoDay,.adt{display:block;font:700 24px/1.2 "Unbounded",system-ui,sans-serif;margin:0 0 14px}
.ag{display:flex;flex-direction:column;gap:6px;max-width:560px}
.agr{font:inherit;color:inherit;text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);border:0;border-radius:14px;padding:9px 12px}
.agi{flex:1;min-width:0;word-break:break-word}
.agi .pt{opacity:1;color:var(--muted)}
.agr.done .agi{text-decoration:line-through;color:var(--muted)}
.agr.done .ic{opacity:.45}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--rose);display:grid;place-items:center;font-size:14px;color:var(--on-rose)}
.agr.done .chk{background:var(--rose)}
.addbtn{background:none;border:1.5px dashed color-mix(in srgb,var(--rose) 50%,transparent);color:var(--rose-ink);border-radius:14px;padding:10px 12px;text-align:left;margin-top:6px}
.addbtn:hover{background:var(--mist)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-items:start}
.cat{background:var(--surface);border-radius:18px;padding:16px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ch h3{margin:0;font-size:16px;font-weight:600;flex:1;min-width:0;word-break:break-word}
.cnt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.it{display:flex;align-items:center;gap:10px;padding:5px 0}
.it input{width:18px;height:18px;padding:0;accent-color:var(--rose);flex:none}
.it span{flex:1;min-width:0;word-break:break-word}
.it.done span{text-decoration:line-through;color:var(--muted)}
.cat form{flex-direction:row;margin-top:8px}
.newcat{flex-direction:row;margin-top:12px;max-width:520px}
.newcat .save{flex:none;white-space:nowrap}

/* splash: the icon's tiles fill in */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:splashOut .4s ease 1.35s forwards}
#splash .tile{width:120px;border-radius:30px;background:var(--surface);overflow:hidden;box-shadow:0 18px 48px rgba(160,70,100,.18);animation:iconIn .6s cubic-bezier(.2,.9,.3,1.15) backwards}
#splash .band{height:28px;background:var(--rose)}
#splash .tg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:14px 14px 16px}
#splash .tg i{aspect-ratio:1;border-radius:5px;animation:fill .3s ease backwards}
#splash .sn{font:700 20px/1 "Unbounded",system-ui,sans-serif;animation:rise2 .5s ease .6s backwards}

@keyframes iconIn{from{transform:scale(.5);opacity:0}}
@keyframes fill{from{background:var(--mist);transform:scale(.5)}}
@keyframes rise2{from{transform:translateY(10px);opacity:0}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(26px) scale(.98);opacity:0}}
@keyframes slideR{from{transform:translateX(30px);opacity:0}}
@keyframes slideL{from{transform:translateX(-30px);opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.go-r{animation:slideR .3s ease-out}
.go-l{animation:slideL .3s ease-out}
.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1) backwards}

@media (max-width:700px){
  .wrap{padding:20px 12px 48px}
  h1{font-size:32px}
  .grid{gap:3px}
  .wh{padding:0 3px 3px;font-size:11px}
  .cell{min-height:84px;padding:5px 2px;border-radius:8px;gap:4px}
  .dn2{font-size:12px;padding-left:2px}
  .pv{gap:2px}
  /* phones: each chore is a small tinted label with time on top */
  .pe{display:block;white-space:normal;font-size:10px;line-height:1.2;padding:2px;border-radius:4px;
    background:color-mix(in srgb,var(--c,var(--rose)) 30%,var(--surface))}
  .cell.today .pe{color:var(--text)}
  .sq{display:none}
  .ptx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto;letter-spacing:-.01em}
  .pt{display:block;margin:0;opacity:.75}
  .sheet{align-items:end;padding:0}
  .panel{width:100%;border-radius:24px 24px 0 0;max-height:88%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash{display:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="tile"><div class="band"></div><div class="tg">
  <i style="background:var(--mist);animation-delay:.3s"></i><i style="background:#8fd1ae;animation-delay:.38s"></i><i style="background:var(--mist);animation-delay:.46s"></i><i style="background:#b9a2ea;animation-delay:.54s"></i>
  <i style="background:#f2b27a;animation-delay:.62s"></i><i style="background:var(--mist);animation-delay:.7s"></i><i style="background:var(--rose);animation-delay:.78s"></i><i style="background:var(--mist);animation-delay:.86s"></i>
  <i style="background:var(--mist);animation-delay:.94s"></i><i style="background:#8db8ec;animation-delay:1.02s"></i><i style="background:var(--mist);animation-delay:1.1s"></i><i style="background:#8fd1ae;animation-delay:1.18s"></i>
</div></div><div class="sn">Планер</div></div>
<div class="wrap">
  <header>
    <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
    <nav>
      <button class="nb" id="prev" aria-label="Предыдущий месяц">‹</button>
      <button class="nb" id="today">Сегодня</button>
      <button class="nb" id="next" aria-label="Следующий месяц">›</button>
      <button class="nb" id="rf" aria-label="Обновить" title="Обновить">↻</button>
      <button class="nb" id="bk" aria-label="Копия данных" title="Копия данных">⋯</button>
    </nav>
  </header>
  <main id="month"></main>
  <div class="sheet" id="sheet" hidden></div>
  <div class="tabs"><button id="tabL" type="button">Списки</button><button id="tabM" type="button">Дела дня</button></div>
  <div id="lower" data-tab="lists">
  <section id="agenda"></section>
  <section class="todo">
    <h2 id="todoDay"></h2>
    <div class="cats" id="cats"></div>
    <form class="newcat" id="catform">
      <input id="catname" type="text" placeholder="Новый раздел, например «Работа»" aria-label="Название раздела">
      <button class="save" type="submit">Создать раздел</button>
    </form>
  </section>
  </div>
</div>
<script>
const KEY = 'planner-week-v1';
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const COLORS = ['', 'c1', 'c2', 'c3', 'c4', 'c5'];
const KINDS = [
  { id: 'clean',   icon: 'ti-bucket',           name: 'Уборка',   text: 'Уборка',            color: '#8fd1ae', re: /убор|пылесос|протер/i },
  { id: 'shop',    icon: 'ti-shopping-cart',    name: 'Продукты', text: 'Купить продукты',   color: '#f2b27a', re: /продукт|магазин|супермаркет/i },
  { id: 'laundry', icon: 'ti-wash-machine',     name: 'Стирка',   text: 'Стирка',            color: '#8db8ec', re: /стир|бельё|белье|гладить|утюг/i },
  { id: 'cook',    icon: 'ti-tools-kitchen-2',  name: 'Готовка',  text: 'Приготовить ужин',  color: '#c46a86', re: /приготов|готовк|готовить|ужин|обед/i },
  { id: 'trash',   icon: 'ti-trash',            name: 'Мусор',    text: 'Вынести мусор',     color: '#b9aeb3', re: /мусор/i },
  { id: 'plants',  icon: 'ti-plant-2',          name: 'Цветы',    text: 'Полить цветы',      color: '#a9cf7e', re: /цветы|цветов|полить|растени/i },
  { id: 'bills',   icon: 'ti-credit-card',      name: 'Счета',    text: 'Оплатить счета',    color: '#b9a2ea', re: /оплат|счета|счёт|коммунал/i },
  { id: 'sport',   icon: 'ti-run',              name: 'Спорт',    text: 'Тренировка',        color: '#ee9db5', re: /спорт|трениров|пробеж|бег/i }
];
function kindOf(e) {
  return KINDS.find(k => k.id === e.kind) || (e.kind == null ? KINDS.find(k => k.re.test(e.title)) : null) || null;
}
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

function startOfWeek(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

const DKEY = 'planner-days-v1';
let dayColors = {};
try { dayColors = JSON.parse(localStorage.getItem(DKEY) || '{}') || {}; } catch (e) { dayColors = {}; }
function saveDays() { try { localStorage.setItem(DKEY, JSON.stringify(dayColors)); } catch (e) {} }
let vy = new Date().getFullYear(), vm = new Date().getMonth(), sel = null, lastAdded = null, pick = iso(new Date());
const MFULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const FWD = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const byTime = (a, b) => (a.time || '99:99').localeCompare(b.time || '99:99');
function dayEvs(k) { return (data[k] || []).slice().sort(byTime); }
// colour of an event: its own colour class wins, then its kind's colour
function tint(n, e) {
  const kd = kindOf(e);
  if (e.color) n.classList.add(e.color);
  else if (kd) n.style.setProperty('--c', kd.color);
  return n;
}
function icon(e, tag) {
  const kd = kindOf(e);
  const n = tint(el(tag || 'span', 'ic'), e);
  const i = el('i', 'ti ' + (kd ? kd.icon : 'ti-point'));
  i.setAttribute('aria-hidden', 'true');
  n.append(i);
  return n;
}

function renderMonth(dir) {
  const box = document.getElementById('month');
  const grid = el('div', 'grid' + (dir === 'r' || dir === 'l' ? ' go-' + dir : ''));
  WD.forEach(w => grid.append(el('div', 'wh', w)));
  const first = new Date(vy, vm, 1);
  const days = new Date(vy, vm + 1, 0).getDate();
  const weeks = Math.ceil((((first.getDay() + 6) % 7) + days) / 7);
  const start = startOfWeek(first);
  const todayKey = iso(new Date());
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = iso(d);
    const evs = dayEvs(k);
    const c = el('button', 'cell' + (d.getMonth() !== vm ? ' out' : '') + (k === todayKey ? ' today' : '')
      + (i % 7 >= 5 ? ' we' : '') + (dayColors[k] ? ' dc d' + dayColors[k].slice(1) : '') + (k === pick ? ' sel' : ''));
    c.type = 'button';
    c.setAttribute('aria-label', d.getDate() + ' ' + MONG[d.getMonth()] + (evs.length ? ', дел: ' + evs.length : ''));
    c.append(el('span', 'dn2', d.getDate()));
    const pv = el('div', 'pv');
    evs.forEach(e => {
      const p = tint(el('div', 'pe' + (e.done ? ' done' : '')), e);
      p.title = (e.time ? e.time + ' ' : '') + e.title;
      const tx = el('span', 'ptx');
      if (e.time) tx.append(el('span', 'pt', e.time));
      tx.append(e.title);
      p.append(el('i', 'sq'), tx);
      pv.append(p);
    });
    c.append(pv);
    c.onclick = () => {
      pick = k; renderMonth(); renderTodo();
      const tb = document.querySelector('.tabs');
      if (tb) tb.scrollIntoView({ behavior: 'smooth', block: window.innerWidth <= 700 ? 'start' : 'nearest' });
    };
    grid.append(c);
  }
  box.innerHTML = '';
  box.append(grid);
  const tt = document.getElementById('title');
  tt.textContent = MFULL[vm];
  tt.append(el('span', 'yr', String(vy)));
  renderAgenda();
}

function renderAgenda() {
  const a = document.getElementById('agenda');
  a.innerHTML = '';
  const k = pick;
  const [Y, M, D] = k.split('-').map(Number);
  const d = new Date(Y, M - 1, D);
  const isToday = k === iso(new Date());
  a.append(el('h2', null, 'Дела дня'));
  const box = el('div', 'ag');
  box.append(el('div', 'adt', FWD[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MONG[d.getMonth()]));
  const evs = dayEvs(k);
  if (!evs.length) box.append(el('div', 'lab', isToday ? 'На сегодня ничего не запланировано' : 'На этот день ничего не запланировано'));
  evs.forEach(e => {
    const row = el('button', 'agr' + (e.done ? ' done' : '')); row.type = 'button';
    const li = el('span', 'agi');
    if (e.time) li.append(el('span', 'pt', e.time));
    li.append(e.title);
    row.append(el('span', 'chk', e.done ? '✓' : ''), icon(e), li);
    row.onclick = () => { e.done = !e.done; save(); renderMonth(); renderSheet(false); };
    box.append(row);
  });
  const add = el('button', 'addbtn', isToday ? '+ Добавить на сегодня' : '+ Добавить на этот день'); add.type = 'button';
  add.onclick = () => { sel = k; renderSheet(false); };
  box.append(add);
  a.append(box);
}

function addEv(k, time, title, color, kind) {
  const ev = { id: Date.now() + Math.random(), time: time, title: title, done: false, color: color, kind: kind };
  (data[k] = data[k] || []).push(ev);
  lastAdded = ev.id;
  save(); renderMonth(); renderSheet(true);
}
function refresh() { save(); renderMonth(); renderSheet(false); }

function renderSheet(focus) {
  const s = document.getElementById('sheet');
  if (!sel) { s.hidden = true; s.innerHTML = ''; return; }
  const fresh = s.hidden;
  const k = sel;
  const [Y, M, D] = k.split('-').map(Number);
  const d = new Date(Y, M - 1, D);
  s.hidden = false; s.innerHTML = '';
  const p = el('div', 'panel' + (fresh ? ' rise' : ''));
  p.setAttribute('role', 'dialog');

  const ph = el('div', 'ph');
  ph.append(el('h3', null, FWD[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MONG[d.getMonth()]));
  const cl = el('button', 'x', '×'); cl.type = 'button'; cl.setAttribute('aria-label', 'Закрыть');
  cl.style.opacity = 1; cl.style.fontSize = '26px';
  cl.onclick = closeSheet;
  ph.append(cl); p.append(ph);

  p.append(el('div', 'lab', 'Цвет дня'));
  const dsw = el('div', 'sw');
  COLORS.forEach(c => {
    const b = el('button', 'swb ' + c + ((dayColors[k] || '') === c ? ' on' : ''));
    b.type = 'button'; b.setAttribute('aria-label', 'Цвет дня');
    b.onclick = () => { if (c) dayColors[k] = c; else delete dayColors[k]; saveDays(); renderMonth(); renderSheet(false); };
    dsw.append(b);
  });
  p.append(dsw);

  const list = dayEvs(k);
  p.append(el('div', 'lab', list.length ? 'Дела на день' : 'Пока ничего не запланировано'));
  list.forEach(ev => {
    const row = el('div', 'ev' + (ev.done ? ' done' : '') + (ev.id === lastAdded ? ' pop' : ''));
    const body = el('div', 'body');
    if (ev.time) body.append(el('span', 't', ev.time));
    body.append(el('span', 'tt', ev.title));
    const dot = icon(ev, 'button'); dot.type = 'button'; dot.title = 'Сменить цвет'; dot.setAttribute('aria-label', 'Сменить цвет');
    dot.onclick = e => { e.stopPropagation(); ev.color = COLORS[(COLORS.indexOf(ev.color || '') + 1) % COLORS.length]; refresh(); };
    const del = el('button', 'x', '×'); del.type = 'button'; del.title = 'Удалить'; del.setAttribute('aria-label', 'Удалить');
    del.onclick = e => { e.stopPropagation(); data[k] = data[k].filter(x => x.id !== ev.id); refresh(); };
    row.onclick = () => { ev.done = !ev.done; refresh(); };
    row.append(dot, body, del);
    p.append(row);
  });
  lastAdded = null;

  p.append(el('div', 'lab', 'Новое дело'));
  const f = el('form');
  const time = el('input'); time.type = 'time'; time.setAttribute('aria-label', 'Время');
  const text = el('input'); text.type = 'text'; text.placeholder = 'Что нужно сделать'; text.setAttribute('aria-label', 'Событие');
  let picked = '';
  const sw = el('div', 'sw');
  COLORS.forEach(c => {
    const b = el('button', 'swb ' + c + (c === '' ? ' on' : '')); b.type = 'button'; b.setAttribute('aria-label', 'Цвет');
    b.onclick = () => { picked = c; sw.querySelectorAll('.swb').forEach(x => x.classList.toggle('on', x === b)); };
    sw.append(b);
  });
  const ok = el('button', 'save', 'Сохранить'); ok.type = 'submit';
  const lt = el('div', 'lab', 'Время (можно не указывать)');
  const ld = el('div', 'lab', 'Дело');
  const lc = el('div', 'lab', 'Цвет');
  [lt, ld, lc].forEach(x => { x.style.margin = '6px 0 0'; });
  f.append(lt, time, ld, text, lc, sw, ok);
  f.onsubmit = e => {
    e.preventDefault();
    const t = text.value.trim();
    if (!t) { text.focus(); return; }
    addEv(k, time.value, t, picked, '');
  };
  p.append(f);
  s.append(p);
  if (focus) text.focus();
}
function closeSheet() { sel = null; renderSheet(false); }
document.getElementById('sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sel) closeSheet(); });

function go(n) {
  vm += n;
  if (vm < 0) { vm = 11; vy--; }
  if (vm > 11) { vm = 0; vy++; }
  renderMonth(n > 0 ? 'r' : 'l');
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('today').onclick = () => { vy = new Date().getFullYear(); vm = new Date().getMonth(); pick = iso(new Date()); renderMonth('f'); renderTodo(); };
let sx = null;
const mb = document.getElementById('month');
mb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
mb.addEventListener('touchend', e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 70) go(dx < 0 ? 1 : -1);
});
renderMonth('f');

const TKEY = 'planner-todo-v1';
let todo = null;
try { todo = JSON.parse(localStorage.getItem(TKEY) || 'null'); } catch (e) { todo = null; }
if (!Array.isArray(todo)) {
  todo = [
    { id: 'c-home', name: 'Домашние дела', days: {} },
    { id: 'c-clean', name: 'Уборка', days: {} },
    { id: 'c-shop', name: 'Купить продукты', days: {} }
  ];
}
function migrateTodo() {
  todo.forEach(cat => {
    cat.days = cat.days || {};
    if (Array.isArray(cat.items)) {
      if (cat.items.length) { const k0 = iso(new Date()); cat.days[k0] = (cat.days[k0] || []).concat(cat.items); }
      delete cat.items;
    }
  });
}
migrateTodo();
function dayItems(cat) { return cat.days[pick] || []; }
function totalItems(cat) { return Object.keys(cat.days).reduce((n, k) => n + cat.days[k].length, 0); }
function saveTodo() { try { localStorage.setItem(TKEY, JSON.stringify(todo)); } catch (e) {} }
let todoFocus = null;
let armedCat = null;

function renderTodo() {
  const box = document.getElementById('cats');
  box.innerHTML = '';
  const [Y, M, D] = pick.split('-').map(Number);
  const pd = new Date(Y, M - 1, D);
  document.getElementById('todoDay').textContent = FWD[(pd.getDay() + 6) % 7] + ', ' + pd.getDate() + ' ' + MONG[pd.getMonth()];
  todo.forEach(cat => {
    const c = el('div', 'cat');
    const h = el('div', 'ch');
    const items = dayItems(cat);
    const left = items.filter(i => !i.done).length;
    h.append(el('h3', null, cat.name));
    if (items.length) h.append(el('span', 'cnt', left + ' из ' + items.length));
    const armed = armedCat === cat.id;
    const rm = el('button', 'x' + (armed ? ' arm' : ''), armed ? 'Удалить?' : '×');
    rm.type = 'button'; rm.title = 'Удалить раздел';
    rm.onclick = () => {
      if (!totalItems(cat) || armed) { todo = todo.filter(x => x !== cat); armedCat = null; }
      else armedCat = cat.id;
      saveTodo(); renderTodo();
    };
    h.append(rm);
    c.append(h);

    items.forEach(it => {
      const row = el('div', 'it' + (it.done ? ' done' : ''));
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!it.done;
      cb.setAttribute('aria-label', 'Выполнено');
      cb.onchange = () => { it.done = cb.checked; saveTodo(); renderTodo(); };
      const del = el('button', 'x', '×'); del.type = 'button'; del.title = 'Удалить';
      del.onclick = () => { cat.days[pick] = items.filter(x => x !== it); if (!cat.days[pick].length) delete cat.days[pick]; saveTodo(); renderTodo(); };
      row.append(cb, el('span', null, it.text), del);
      c.append(row);
    });

    const f = el('form');
    const inp = el('input'); inp.type = 'text'; inp.placeholder = 'Добавить дело';
    inp.setAttribute('aria-label', 'Новое дело в разделе ' + cat.name);
    inp.dataset.tf = cat.id;
    f.append(inp);
    f.onsubmit = e => {
      e.preventDefault();
      const t = inp.value.trim();
      if (!t) return;
      (cat.days[pick] = cat.days[pick] || []).push({ id: Date.now() + Math.random(), text: t, done: false });
      todoFocus = cat.id; armedCat = null;
      saveTodo(); renderTodo();
    };
    c.append(f);
    box.append(c);
  });
  if (todoFocus) {
    const n = box.querySelector('[data-tf="' + todoFocus + '"]');
    if (n) n.focus();
    todoFocus = null;
  }
}

document.getElementById('catform').onsubmit = e => {
  e.preventDefault();
  const inp = document.getElementById('catname');
  const name = inp.value.trim();
  if (!name) return;
  todo.push({ id: 'c' + Date.now(), name, days: {} });
  inp.value = '';
  saveTodo(); renderTodo();
};
renderTodo();
const VER = '13';
let tab = 'lists';
try { tab = localStorage.getItem('planner-tab') || 'lists'; } catch (e) {}
function setTab(t) {
  tab = t;
  document.getElementById('lower').dataset.tab = t;
  document.getElementById('tabL').classList.toggle('on', t === 'lists');
  document.getElementById('tabM').classList.toggle('on', t === 'day');
  try { localStorage.setItem('planner-tab', t); } catch (e) {}
}
document.getElementById('tabL').onclick = () => setTab('lists');
document.getElementById('tabM').onclick = () => setTab('day');
if (tab !== 'day') tab = 'lists';
setTab(tab);

function updateSub() {
  const n = new Date(), wd = FWD[(n.getDay() + 6) % 7];
  const sub = document.getElementById('sub');
  if (sub) sub.textContent = 'Сегодня ' + wd.toLowerCase() + ', ' + n.getDate() + ' ' + MONG[n.getMonth()];
  const a = document.getElementById('spw'), b = document.getElementById('spn');
  if (a) a.textContent = wd;
  if (b) b.textContent = n.getDate();
}
updateSub();
let lastToday = iso(new Date());
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    const t = iso(new Date());
    if (pick === lastToday) pick = t;
    lastToday = t;
    updateSub(); renderMonth(); renderTodo();
  }
});

document.getElementById('rf').onclick = () => {
  fetch(location.pathname, { cache: 'reload' }).catch(() => {}).finally(() => location.reload());
};
try {
  fetch(location.pathname, { cache: 'reload' }).then(r => r.text()).then(t => {
    const m = t.match(/const VER = '([^']+)'/);
    if (m && m[1] !== VER && sessionStorage.getItem('planner-rl') !== m[1]) {
      sessionStorage.setItem('planner-rl', m[1]);
      location.reload();
    }
  }).catch(() => {});
} catch (e) {}

document.getElementById('bk').onclick = () => {
  sel = null;
  const s = document.getElementById('sheet');
  const fresh = s.hidden;
  s.hidden = false; s.innerHTML = '';
  const p = el('div', 'panel' + (fresh ? ' rise' : ''));
  const ph = el('div', 'ph');
  ph.append(el('h3', null, 'Копия данных'));
  const cl = el('button', 'x', '×'); cl.type = 'button'; cl.setAttribute('aria-label', 'Закрыть');
  cl.style.opacity = 1; cl.style.fontSize = '26px'; cl.onclick = closeSheet;
  ph.append(cl); p.append(ph);
  p.append(el('div', 'lab', 'Скопируй этот текст и сохрани в заметках. Если записи пропадут, вставь его в поле ниже.'));
  const out = el('textarea'); out.readOnly = true; out.rows = 4;
  out.value = JSON.stringify({ v: 1, data: data, dayColors: dayColors, todo: todo });
  p.append(out);
  const msg = el('div', 'msg');
  const cp = el('button', 'save', 'Скопировать'); cp.type = 'button';
  cp.onclick = () => {
    out.select(); out.setSelectionRange(0, out.value.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    if (!ok && navigator.clipboard) navigator.clipboard.writeText(out.value).catch(() => {});
    msg.textContent = 'Скопировано. Если не вышло, выдели текст и скопируй вручную.';
  };
  p.append(cp);
  p.append(el('div', 'lab', 'Восстановить из копии'));
  const inp = el('textarea'); inp.rows = 3; inp.placeholder = 'Вставь сюда сохранённый текст';
  p.append(inp);
  const rs = el('button', 'cancel', 'Заменить данные из текста'); rs.type = 'button';
  rs.onclick = () => {
    try {
      const o = JSON.parse(inp.value.trim());
      if (!o || typeof o !== 'object' || !o.data) throw new Error('bad');
      data = o.data; dayColors = o.dayColors || {};
      if (Array.isArray(o.todo)) { todo = o.todo; migrateTodo(); }
      save(); saveDays(); saveTodo(); renderMonth(); renderTodo();
      msg.textContent = 'Данные восстановлены.';
    } catch (e) {
      msg.textContent = 'Не получилось прочитать текст. Скопируй его целиком.';
    }
  };
  p.append(rs, msg);
  s.append(p);
};

setTimeout(() => { const sp = document.getElementById('splash'); if (sp) sp.remove(); }, 1900);
</script>
